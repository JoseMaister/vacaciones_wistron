<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        html, body {
            height: 100%;
        }
        .container-center {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100%;
        }
    </style>
</head>
<body class="bg-light">

<div class="container container-center">
    <div class="row justify-content-center w-100">
        <div class="col-sm-8 col-md-6 col-lg-5">
            
            <div class="card shadow-sm p-4">
                
                <h2 class="card-title text-center mb-4">Change Password</h2>
                <p class="text-center text-muted">Please sign in with your new password.</p>
                <form id="resetPasswordForm" action="/api/reset-password" method="POST">
                    
                    <input type="hidden" name="token" value="[COLOCA_AQUÍ_EL_TOKEN_DE_SEGURIDAD]">
                    
                    <div class="mb-3">
                        <label for="newPassword" class="form-label">New Password</label>
                        <input 
                            type="password" 
                            class="form-control" 
                            id="newPassword" 
                            name="newPassword"
                            placeholder="8 Characters minimum"
                            minlength="8" 
                            required
                        >
                    </div>

                    <div class="mb-3">
                        <label for="confirmPassword" class="form-label">Confirm Password</label>
                        <input 
                            type="password" 
                            class="form-control" 
                            id="confirmPassword" 
                            name="confirmPassword"
                            placeholder="Please re-enter your password"
                            minlength="8" 
                            required
                        >
                        <div id="passwordMatchError" class="form-text text-danger d-none">
                            🚨 The passwords entered do not match.
                        </div>
                    </div>

                    <button type="submit"href="login.html" class="btn btn-primary w-100 mt-3">Save and Sign In</button>
                
                </form>
                
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
    // LÓGICA JAVASCRIPT: Valida que las contraseñas coincidan antes de enviar
    document.getElementById('resetPasswordForm').addEventListener('submit', function(event) {
        const newPass = document.getElementById('newPassword').value;
        const confirmPass = document.getElementById('confirmPassword').value;
        const errorDiv = document.getElementById('passwordMatchError');

        // Compara los dos campos
        if (newPass !== confirmPass) {
            // Si NO coinciden:
            event.preventDefault(); // Detiene el envío del formulario al servidor
            errorDiv.classList.remove('d-none'); // Muestra el mensaje de error
            
            // Opcional: enfocar el campo para que el usuario sepa dónde corregir
            document.getElementById('newPassword').focus(); 
        } else {
            // Si SÍ coinciden:
            errorDiv.classList.add('d-none'); // Asegura que el mensaje de error esté oculto
            // El formulario se envía al servidor para la actualización final (Backend)
        }
    });
</script>

</body>
</html>
