<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>Change Password</title>

  <link rel="stylesheet" href="{{ url_for('static', filename='assets/dist/css/bootstrap.min.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='dashboard.css') }}">
</head>

<body>

<!-- Header -->
<header class="navbar navbar-dark sticky-top bg-dark flex-md-nowrap p-0 shadow">
  <div class="navbar-brand col-md-3 col-lg-2 me-0 px-3">
    <img src="{{ url_for('static', filename='logowistron.png') }}" height="50">
  </div>

  <div class="navbar-nav">
    <div class="nav-item text-nowrap">
      <a class="nav-link px-3" href="{{ url_for('logout') }}">Sign out</a>
    </div>
  </div>
</header>

<div class="container-fluid">
  <div class="row">

    <!-- Sidebar -->
    <nav id="sidebarMenu" class="col-md-3 col-lg-2 d-md-block bg-light sidebar collapse">
      <div class="position-sticky pt-5">
        <ul class="nav flex-column">

          {% if session.role_id == 1 %}
          <li class="nav-item">
            <a class="nav-link" href="{{ url_for('index') }}">Vacation Log</a>
          </li>
          <hr>
          {% endif %}

          <li class="nav-item">
            <a class="nav-link" href="{{ url_for('show_requests') }}">View Requests</a>
          </li>

          {% if session.role_id != 1 %}
          <hr>
          <li class="nav-item">
            <a class="nav-link" href="{{ url_for('calendar_view') }}">Vacation Calendar</a>
          </li>
          {% endif %}

          {% if session.role_id in [2,3] %}
          <hr>
          <li class="nav-item">
            <a class="nav-link" href="{{ url_for('add_user_view') }}">Add User</a>
          </li>
          {% endif %}

          <hr>
          <li class="nav-item">
            <a class="nav-link active" href="{{ url_for('change_password_view') }}">
              Change Password
            </a>
          </li>

        </ul>
      </div>
    </nav>

    <!-- Main -->
    <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4">
      <div class="pt-3 pb-2 mb-3 border-bottom">
        <h1 class="h2">Change Password</h1>
      </div>

      <div class="card col-lg-6">
        <div class="card-header">Update your password 🔐</div>
        <div class="card-body">

          <form id="changePasswordForm">

            <div class="mb-3">
              <label class="form-label">Current Password</label>
              <input type="password" class="form-control" id="current_password" required>
            </div>

            <div class="mb-3">
              <label class="form-label">New Password</label>
              <input type="password" class="form-control" id="new_password" required>
            </div>

            <div class="mb-3">
              <label class="form-label">Confirm New Password</label>
              <input type="password" class="form-control" id="confirm_password" required>
            </div>

            <button class="btn btn-primary w-100">Update Password</button>
          </form>

          <div id="passwordMsg" class="alert mt-3" style="display:none"></div>

        </div>
      </div>
    </main>

  </div>
</div>

<script>
document.getElementById("changePasswordForm").addEventListener("submit", async e => {
  e.preventDefault();

  const msg = document.getElementById("passwordMsg");

  const res = await fetch("/change-password", {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({
      current_password: current_password.value,
      new_password: new_password.value,
      confirm_password: confirm_password.value
    })
  });

  const data = await res.json();
  msg.style.display = "block";

  if(res.ok){
    msg.className = "alert alert-success";
    msg.textContent = "✅ Password updated successfully";
    e.target.reset();
  } else {
    msg.className = "alert alert-danger";
    msg.textContent = "❌ " + data.error;
  }
});
</script>

<script src="{{ url_for('static', filename='js/bootstrap.bundle.min.js') }}"></script>
</body>
</html>
